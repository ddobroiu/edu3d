name: Deploy edu3d

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/edu3d:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@master
        with:
          host: 178.104.20.127
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/apps/edu3d
            cd /opt/apps/edu3d
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Setarile se scriu literal (heredoc intre ghilimele): valori ca
            # EMAIL_FROM="edu3d <contact@edu3d.ro>" nu mai sunt interpretate de shell.
            cat > .env <<'ENV_CONTENTS_EOF'
            ${{ secrets.ENV_CONTENTS }}
            ENV_CONTENTS_EOF
            if [ ! -s .env ]; then echo "ENV_CONTENTS gol - opresc deploy-ul"; exit 1; fi

            cat <<EOF > docker-compose.yml
            services:
              edu3d-app:
                image: ghcr.io/${{ github.repository_owner }}/edu3d:latest
                container_name: edu3d-app
                restart: unless-stopped
                ports:
                  - "3004:3000"
                env_file: .env
            EOF
            # Imaginea noua se descarca inainte sa oprim ceva
            docker compose pull || exit 1

            # edu3d preia portul 3004 de la vechiul kidmy, abia acum, cand totul e pregatit.
            # Daca edu3d nu porneste, kidmy este repornit, ca site-ul sa nu ramana cazut.
            docker rm -f kidmy-app 2>/dev/null || true
            if ! docker compose up -d --force-recreate; then
              echo "edu3d nu a pornit - repornesc kidmy"
              (cd /opt/apps/kidmy && docker compose up -d)
              exit 1
            fi
